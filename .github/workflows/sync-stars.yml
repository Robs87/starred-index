# 走 GitHub Actions workflow 调用
name: Sync Starred Repos

on:
  schedule:
    - cron: '0 16 * * *'  # 每天 UTC 08:00 / 北京 16:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync starred repos and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_stars.py
